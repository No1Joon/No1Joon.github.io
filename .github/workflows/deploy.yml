name: Deploy Jekyll to Firebase Hosting (github.io redirects)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies and generate OG images
        run: |
          npm ci
          npm run generate-og

      - uses: actions/configure-pages@v6

      # 직전 배포본의 본문 지문 — _plugins/content_lastmod.rb 가 비교해 바뀐 글에만 수정 시각을 준다
      - name: Fetch previous content fingerprints
        run: curl -fsSL https://cailmeal.com/lastmod.json -o .lastmod-prev.json || echo "no previous manifest"

      - run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      # Firebase Hosting(cailmeal-blog) — 키 없이 Workload Identity 로 인증한다 (main 브랜치만 허용)
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/859734287766/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-action-1202500152@cailmeal-blog.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@15.34.0 deploy --only hosting --project cailmeal-blog --non-interactive

      # github.io 에는 같은 경로의 cailmeal.com 으로 넘기는 페이지만 올린다
      - name: Build github.io redirect site
        run: python3 scripts/make-redirect-site.py _site _redirect

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _redirect

      - uses: actions/upload-artifact@v7
        with:
          name: indexnow-urls
          path: .indexnow-urls.txt
          include-hidden-files: true
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # 본문이 바뀐 URL 만 IndexNow 로 통지한다 (Bing·네이버·Yandex 등이 공유받음, Google 은 미지원 — Google 은 sitemap lastmod 로 판단)
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    env:
      INDEXNOW_KEY: 06b5574a68e4933546881fa33ceae910
      SITE: https://cailmeal.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: indexnow-urls
      - name: Submit changed URLs
        run: |
          if [ ! -s .indexnow-urls.txt ]; then echo "no changed URLs"; exit 0; fi
          cat .indexnow-urls.txt
          # 배포 반영 확인 — 키 파일이 라이브에서 읽혀야 검색엔진이 소유를 검증한다
          for i in $(seq 1 10); do
            [ "$(curl -fsS "$SITE/$INDEXNOW_KEY.txt" || true)" = "$INDEXNOW_KEY" ] && break
            sleep 15
          done
          jq -R -s -c --arg key "$INDEXNOW_KEY" --arg host "${SITE#https://}" --arg loc "$SITE/$INDEXNOW_KEY.txt" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: (split("\n") | map(select(length > 0)))}' \
            .indexnow-urls.txt > payload.json
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @payload.json)
          echo "IndexNow HTTP $code"; cat response.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
