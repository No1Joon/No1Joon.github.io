<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="iAyNtzaozZxt1n8Xj-3xoG29n4Xm1E4Dm8Toyy6RZ_A" />
  <meta name="naver-site-verification" content="4daaf94ddc9f57e886c6fca50aef3733dc218b2a" />
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" sizes="512x512">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  {% include analytics.html %}
</head>
<body class="preload">
  <header class="site-header">
    <div class="inner">
      <a href="{{ '/' | relative_url }}" class="site-title">No1Joon<span>.dev</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}">Posts</a>
        <a href="{{ '/resume' | relative_url }}">Resume</a>
        <a href="https://github.com/No1Joon" target="_blank">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} No1Joon — Built with Jekyll & GitHub Pages</p>
  </footer>

  <script>
    requestAnimationFrame(() => {
      requestAnimationFrame(() => document.body.classList.remove('preload'));
    });
  </script>
</body>
</html>
