<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">QR 코드 전체 구조도 (버전 2, 25×25 모듈)</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">QR 코드의 주요 섹션을 색으로 구분한 도식입니다. 좌상·우상·좌하의 Finder Pattern 3개, 우하 근처의 Alignment Pattern, 가로·세로의 Timing Pattern, Finder 주변의 Format Information, 그리고 가운데를 채우는 Data + Error Correction 영역과 외곽 Quiet Zone을 보여줍니다.</desc>
