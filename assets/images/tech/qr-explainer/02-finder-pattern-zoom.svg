<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">QR 코드 파인더 패턴 하나를 7×7 모듈 단위로 확대해, 가운데 행과 가운데 열을 가로지를 때 검:흰:검:흰:검 = 1:1:3:1:1 비율이 나타나는 모습을 보여줍니다. 이 비율은 어느 방향에서 스캔해도 유지되며 카메라가 QR을 인식하는 핵심 신호입니다.</desc>
