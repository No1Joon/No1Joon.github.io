- file: 2_term_saml.png
  title: NetScaler shell — checking SAML configuration
  text: |
    # check installed build; affected if below 14.1-73.41 · 13.1-64.28
    > show ns version

    # affected if there is an auth action used as SAML SP
    $ grep -i "add authentication samlAction" /nsconfig/ns.conf

    # affected if there is a SAML IdP profile
    $ grep -i "add authentication samlIdPProfile" /nsconfig/ns.conf
