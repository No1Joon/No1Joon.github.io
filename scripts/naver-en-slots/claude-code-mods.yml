    \ ❯ ./register.ts env reads: HOME\n\n$ claude plugin validate blast-radius   # Anthropic sample\n  ❯ ./blast-radius.mjs hooks: tool.call{tool=Bash},\n    ui.render{component=Pane}, ui.render{component=AbovePrompt}\n\
    \  ❯ ./blast-radius.mjs gating hook without .catch: tool.call{tool=Bash}\n  ❯ ./blast-radius.mjs calls: $.clock.now, $.process.run,\n    $.session.cwd, $.ui.close, $.ui.invalidate, $.ui.open, ...\n"
- file: 5_items_정리.png
  en:
    items:
    - - Before installing
      - Check the hooks and calls lines with claude plugin validate
    - - The calls line
      - If $.fs, $.process, $.http, or $.env appears, read the code too
    - - The hooks line
      - tool.call and tool.check can change or approve tool calls
    - - Using it as a guard
      - String checks miss variant commands; pair with deny rules
    - - If something goes wrong
      - Disable installed mods with claude --safe-mode and check
