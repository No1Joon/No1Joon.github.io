  - gating hook with .catch
  text: "$ claude plugin validate rm-guard   # before adding .catch\n  ❯ ./register.ts hooks: tool.call{tool=Bash}\n  ❯ ./register.ts gating hook without .catch: tool.call{tool=Bash}\n  ❯ ./register.ts\
    \ calls: $.ui.status\n\n$ claude plugin validate rm-guard   # after adding .catch\n  ❯ ./register.ts hooks: tool.call{tool=Bash}\n  ❯ ./register.ts gating hook with .catch: tool.call{tool=Bash}\n  ❯\
    \ ./register.ts calls: $.ui.status\n"
