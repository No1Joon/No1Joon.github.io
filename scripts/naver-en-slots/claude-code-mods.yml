- file: 1_term_가드코드.png
  font: d2
  title: rm-guard/hooks/register.ts
  width: 72
  line_height: 1.3
  pad: 1.7
  text: "import type { Register } from 'claude-code'\n\n// pattern that catches rm -rf and git push --force\nconst RISKY = /\\brm\\s+-[a-z]*r[a-z]*f|\\bgit\\s+push\\b.*(--force|-f\\b)/\n\nlet blocked =\
    \ 0\n\nexport const register: Register = on => {\n  // runs right before Claude calls the Bash tool\n  on('tool.call', { tool: 'Bash' }, ($, e, next) => {\n    if (!RISKY.test(e.command)) return next(e)\
    \  // pass\n    blocked += 1\n    $.ui.status(`rm-guard: blocked ${blocked}`)\n    return { deny: `rm-guard: \"${e.command.slice(0, 40)}\" is blocked` }\n  }).catch(($, e, next) =>\n    // if the check\
    \ crashes, fail closed\n    next.called ? next(e) : { deny: 'rm-guard: its check failed' },\n  )\n}\n"
