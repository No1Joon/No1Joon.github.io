  text: |
    # size of the generative model folder and the Siri and translation asset folders
    $ du -sh /System/Library/AssetsV2/*UAF_FM_GenerativeModels \
        /System/Library/AssetsV2/*UAF_Siri_Understanding \
        /System/Library/AssetsV2/*UAF_Translation_Assets \
        /System/Library/AssetsV2/*UAF_Siri_TextToSpeech
    du: /System/Library/AssetsV2/com_apple_MobileAsset_UAF_FM_GenerativeModels: Operation not permitted
    2.4G	/System/Library/AssetsV2/com_apple_MobileAsset_UAF_Siri_Understanding
    1.8G	/System/Library/AssetsV2/com_apple_MobileAsset_UAF_Translation_Assets
