- file: 4_term_네이버.png
  title: zsh — checking the www.naver.com certificate
  text: "# pick out only the public key type and signature scheme\n$ echo | openssl s_client -connect www.naver.com:443 \\\n    -servername www.naver.com 2>/dev/null \\\n    | grep -E \"a:PKEY|Peer signature\
    \ type\" | sed -n '1p;$p'\n   a:PKEY: EC, (prime256v1); sigalg: sha256WithRSAEncryption\nPeer signature type: ecdsa_secp256r1_sha256\n"
