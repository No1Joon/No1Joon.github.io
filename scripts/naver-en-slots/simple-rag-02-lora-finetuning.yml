- file: 2_term_train.png
  title: zsh — mlx_lm LoRA training
  text: |
    # run via a low-load wrapper pausing each step; same args, output
    # save and eval interval options omitted; … omits fields mid-output
    $ mlx_lm.lora --model mlx-community/Qwen3-4B-Instruct-2507-4bit \
        --train --data sft_2400 --fine-tune-type lora \
        --num-layers 16 --batch-size 1 --grad-accumulation-steps 4 \
        --iters 2400 --learning-rate 1e-4 --max-seq-length 1024 \
        --grad-checkpoint --adapter-path out/lora_2400
    Trainable parameters: 0.182% (7.340M/4022.468M)
    Iter 1: Val loss 2.401, Val took 182.823s
    Iter 40: Train loss 1.672, … Peak mem 3.938 GB
    Iter 2400: Val loss 1.072, Val took 905.838s
    Iter 2400: Train loss 1.039, … Peak mem 3.991 GB
